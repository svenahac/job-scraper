name: Scrape jobs

on:
  schedule:
    # GitHub starts scheduled runs late (three to seven hours seen), so the
    # run is scheduled early and the wait jobs sleep until 18:00
    # Europe/Ljubljana. 08:30 UTC leaves room for an 8.5-hour delay in winter
    # and 7.5 hours in summer; a run that starts after 18:00 scrapes at once.
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One job may run for at most six hours, so the wait is two back-to-back
  # jobs, each sleeping up to 5 h 40 min of the time left. Manual runs skip
  # the wait and scrape immediately.
  wait:
    if: github.event_name == 'schedule'
    strategy:
      max-parallel: 1
      matrix:
        part: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Wait until 18:00 Ljubljana
        run: |
          # Without zone data, TZ silently falls back to UTC; fail loudly instead.
          if ! [[ $(TZ=Europe/Ljubljana date +%z) =~ ^\+0[12]00$ ]]; then
            echo "::error::No Europe/Ljubljana time zone data on this runner"
            exit 1
          fi
          today=$(TZ=Europe/Ljubljana date +%F)
          target=$(TZ=Europe/Ljubljana date -d "$today 18:00" +%s)
          left=$(( target - $(date +%s) ))
          if [ "$left" -le 0 ]; then
            echo "18:00 Ljubljana has passed; nothing to wait for."
            exit 0
          fi
          nap=$(( left < 20400 ? left : 20400 ))
          echo "Sleeping $(( nap / 60 )) of the $(( left / 60 )) minutes left until 18:00 Ljubljana."
          sleep "$nap"

  scrape:
    needs: wait
    # Run after the wait, or straight away on a manual run (wait skipped).
    if: ${{ !cancelled() }}
    concurrency:
      group: scrape
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The SQLite store holds full ad texts, which several portals' terms
      # forbid republishing, so it lives in the Actions cache rather than in
      # this public repository. Losing it only costs one slower run.
      - name: Restore the job store
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobs-db-

      - name: Scrape
        run: npm run scrape
        env:
          # Optional. Without it Himalayas is queried on the shared public quota.
          HIMALAYAS_API_KEY: ${{ secrets.HIMALAYAS_API_KEY }}

      - name: Save the job store
        if: always() && hashFiles('data/jobs.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}-${{ github.run_attempt }}

      # Each commit of the app's data file triggers a Vercel redeploy.
      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: scrape $(date -u +%Y-%m-%d)"
            git push
          fi
